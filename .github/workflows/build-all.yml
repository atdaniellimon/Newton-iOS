name: Build All Platforms (iOS & macOS)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.json'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest  # Te da el macOS más nuevo y su Xcode por defecto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Imprime la versión actual en la consola para tu control, pero usa la última por defecto
      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Newton iOS App
        run: |
          mkdir -p build/Release-iphoneos
          set -o pipefail
          xcodebuild build \
            -project "ios/Newton/Newton.xcodeproj" \
            -scheme "Newton" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" 2>&1 | tee /tmp/xcodebuild.log

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Release-iphoneos/Newton.app" build/Payload/
          cd build
          zip -r -y "Newton.ipa" Payload
          ls -lh Newton.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Newton-iOS-App-IPA
          path: build/Newton.ipa
          retention-days: 14

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest  # Te da el macOS más nuevo y su Xcode por defecto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Mac Build Script
        run: |
          chmod +x mac/build_mac.sh
          ./mac/build_mac.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Newton-macOS-Universal-DMG
          path: build/Newton-Mac.dmg
          retention-days: 14
