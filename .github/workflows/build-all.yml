name: Build All Platforms (iOS & macOS)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.json'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest  # Te da el macOS más nuevo y su Xcode por defecto
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Imprime la versión actual en la consola para tu control, pero usa la última por defecto
      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Newton iOS App
        run: |
          mkdir -p build/Release-iphoneos
          set +e
          xcodebuild build \
            -project "ios/Newton/Newton.xcodeproj" \
            -scheme "Newton" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" > /tmp/xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E "(error:|fatal error:)" /tmp/xcodebuild.log | head -n 30)
            if ! grep -q -E "(error:|fatal error:)" /tmp/xcodebuild.log; then
              while IFS= read -r line; do
                echo "::error::$line"
              done < <(tail -n 25 /tmp/xcodebuild.log)
            fi
            exit $STATUS
          fi

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Release-iphoneos/Newton.app" build/Payload/
          cd build
          zip -r -y "Newton.ipa" Payload
          ls -lh Newton.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Newton-iOS-App-IPA
          path: build/Newton.ipa
          retention-days: 14

  build-mac:
    name: Build macOS Desktop DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron App & DMG
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Newton-Desktop-macOS-DMG
          path: desktop/dist/*.dmg
          retention-days: 14
