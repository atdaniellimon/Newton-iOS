name: Build Newton iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Newton App
        run: |
          mkdir -p build/Release-iphoneos
          xcodebuild build \
            -project "ios/Newton/Newton.xcodeproj" \
            -scheme "Newton" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos"

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Release-iphoneos/Newton.app" build/Payload/
          cd build
          zip -r -y "Newton.ipa" Payload
          cp "Newton.ipa" "Newton_v3.3.ipa"
          ls -lh Newton.ipa Newton_v3.3.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newton-iOS-v3.3-IPA
          path: build/Newton.ipa
          retention-days: 14
