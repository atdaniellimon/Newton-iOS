name: Build Newton iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build and Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project "ios/Newton/Newton.xcodeproj" \
            -scheme "Newton" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/Newton.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r "build/Newton.xcarchive/Products/Applications/Newton.app" build/Payload/
          cd build
          zip -r -y "Newton.ipa" Payload
          ls -lh Newton.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newton-iOS-IPA
          path: build/Newton.ipa
          retention-days: 14
