name: Build Newton macOS DMG

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS DMG & App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron App & DMG
        working-directory: desktop
        run: npx electron-builder --mac dmg --publish never

      - name: Package App as ZIP
        working-directory: desktop/dist/mac
        run: zip -r -y "../Newton-Mac.zip" "Newton.app"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newton-Desktop-macOS-DMG
          path: desktop/dist/*.dmg
          retention-days: 14

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Newton-Desktop-macOS-ZIP
          path: desktop/dist/Newton-Mac.zip
          retention-days: 14
